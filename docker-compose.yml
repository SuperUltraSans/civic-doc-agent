# 실행: docker compose up --build
# 종료: docker compose down
#
# 포트·바인드 주소는 루트 .env 로 바꾼다 (.env.example 참고).
#   BIND_ADDR  기본 127.0.0.1 — 이 컴퓨터에서만 접속. 같은 와이파이의 휴대폰으로 시험하려면 0.0.0.0
#   BACK_PORT  기본 8000
#   FRONT_PORT 기본 3000
# 같은 컴퓨터에서 다른 서비스가 이 포트를 쓰고 있으면 .env 에서 다른 번호로 바꾼다.

services:
  back:
    build: ./back
    container_name: civic-back
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACK_PORT:-8000}:8000"
    env_file:
      - path: .env        # API 키 등 (커밋 금지). 없으면 무시됨
        required: false
    volumes:
      - ./back:/app       # 코드 수정 후 컨테이너만 재시작하면 반영 (재빌드 불필요)
    restart: unless-stopped

  front:
    build: ./front
    container_name: civic-front
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONT_PORT:-3000}:3000"
    environment:
      - API_URL=http://back:8000                    # 컨테이너 간 통신은 서비스 이름으로 (Vite 프록시 대상)
      - VITE_USE_MOCK=${VITE_USE_MOCK:-false}       # true 면 백엔드 없이 목업으로 동작
      - VITE_MOCK_SPEED=${VITE_MOCK_SPEED:-normal}
    volumes:
      - ./front:/app
      - /app/node_modules # 호스트의 node_modules 가 컨테이너 것을 덮어쓰지 않도록
    depends_on:
      - back
    restart: unless-stopped
