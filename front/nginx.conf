# 읽어드림 프론트 배포용 정적 서버 (Dockerfile.prod).
# HTTPS 엣지가 /civic-doc-agent/ 프리픽스를 떼고 넘기므로 여기서는 루트 기준으로 서빙한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 빌드 결과의 해시가 붙은 파일은 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: 없는 경로는 index.html 로 (새로고침해도 /result/:docId 가 열리게). index.html 은 캐시하지 않는다
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
