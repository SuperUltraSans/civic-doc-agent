# 배포용 — HTTPS 리버스 프록시(엣지) 뒤 https://kimanyfootcleaner.asuscomm.com/civic-doc-agent/
#
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml down
#
# - 포트를 공개하지 않는다. 엣지와 같은 외부 네트워크 edge-net 에만 붙고, 엣지가 경로로 넘긴다.
#     /civic-doc-agent/api/ → civic-doc-agent-back:8000 (프리픽스 제거, SSE)
#     /civic-doc-agent/     → civic-doc-agent-front:80  (프리픽스 제거, 정적 SPA)
#   엣지 설정은 이 저장소 밖에 있다. 위 두 경로 규칙(api 는 응답 버퍼링 끔)만 있으면 된다.
# - 키·모드는 루트 .env 에서 읽는다 (개발용 docker-compose.yml 과 같은 파일).
# - 개발용 스택(docker-compose.yml)과 프로젝트 이름·컨테이너 이름이 달라 서로 겹치지 않는다.

name: civic-doc-agent-prod

services:
  back:
    build: ./back
    image: civic-doc-agent-back:prod
    container_name: civic-doc-agent-back
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=https://kimanyfootcleaner.asuscomm.com
      - DB_PATH=/app/var/app.db   # 기관 공식 번호 캐시 (Memory). 컨테이너를 다시 만들어도 남게 볼륨에 둔다
    volumes:
      - back-var:/app/var
    networks: [edge-net]
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.prod
      args:
        BASE_PATH: /civic-doc-agent/
    image: civic-doc-agent-front:prod
    container_name: civic-doc-agent-front
    networks: [edge-net]
    depends_on:
      - back
    restart: unless-stopped

volumes:
  back-var:

networks:
  edge-net:
    external: true
